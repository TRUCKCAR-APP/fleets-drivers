server:
  port: 8081

spring:
  application:
    name: ms-fleets-drivers

  datasource:
    url: jdbc:postgresql://localhost:5432/truckdar_db
    username: truckdar_admin
    password: truckdar_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: localhost
      port: 6379

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: fleets-drivers-group
      # earliest: en el primer arranque reconstruye las cargas activas desde el historial del tópico.
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

truckdar:
  services:
    # Load-Allocation: verifica la propiedad de una carga al suscribirse a /topic/trip/{loadId}.
    load-allocation-url: ${TRUCKDAR_SERVICES_LOAD_ALLOCATION_URL:http://localhost:8083}
  websocket:
    # Orígenes del handshake de /ws-telemetry (el api-gateway ya filtra CORS y no reenvía Origin).
    allowed-origin-patterns: ${TRUCKDAR_WEBSOCKET_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}
  kafka:
    topic:
      vehicle-status: ${TRUCKDAR_VEHICLE_STATUS_TOPIC:truckdar.events.vehicle-status}
      load-events: ${TRUCKDAR_LOAD_EVENTS_TOPIC:truckdar.events.load-allocation}
  outbox:
    publish-interval-ms: ${TRUCKDAR_OUTBOX_PUBLISH_INTERVAL_MS:1000}
    batch-size: ${TRUCKDAR_OUTBOX_BATCH_SIZE:100}