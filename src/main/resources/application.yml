server:
  port: 8081

spring:
  application:
    name: ms-fleets-drivers

  datasource:
    # Fuera de Docker (IDE/tests) la conexión es directa y el esquema va en currentSchema. En Docker se pasa por
    # PgBouncer y el search_path lo fija el rol del servicio.
    url: jdbc:postgresql://localhost:5432/truckcar_db?currentSchema=fleets_drivers,public
    username: truckcar_admin
    password: truckcar_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # El esquema lo gestiona Flyway (db/migration); Hibernate solo comprueba que coincida con las entidades.
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    # Esquema propio del servicio (rol y esquema creados por db-init); el historial de Flyway vive en él.
    schemas: fleets_drivers
    default-schema: fleets_drivers
    # Bases anteriores a Flyway (tablas creadas por Hibernate): línea base 0 para que V1 (idempotente) se aplique.
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration

  data:
    redis:
      host: localhost
      port: 6379

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: fleets-drivers-group
      # earliest: en el primer arranque reconstruye las cargas activas desde el historial del tópico.
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

truckcar:
  services:
    # Load-Allocation: verifica la propiedad de una carga al suscribirse a /topic/trip.{loadId}.
    load-allocation-url: ${TRUCKCAR_SERVICES_LOAD_ALLOCATION_URL:http://localhost:8083}
  websocket:
    # Orígenes del handshake de /ws-telemetry (el api-gateway ya filtra CORS y no reenvía Origin).
    allowed-origin-patterns: ${TRUCKCAR_WEBSOCKET_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}
    # Broker STOMP externo (RabbitMQ): necesario para más de una réplica. Sin él, broker simple en memoria.
    broker-relay:
      enabled: ${TRUCKCAR_STOMP_RELAY_ENABLED:false}
      host: ${TRUCKCAR_STOMP_RELAY_HOST:localhost}
      port: ${TRUCKCAR_STOMP_RELAY_PORT:61613}
      virtual-host: ${TRUCKCAR_STOMP_RELAY_VHOST:/}
      login: ${TRUCKCAR_STOMP_RELAY_LOGIN:guest}
      passcode: ${TRUCKCAR_STOMP_RELAY_PASSCODE:guest}
  kafka:
    topic:
      vehicle-status: ${TRUCKCAR_VEHICLE_STATUS_TOPIC:truckcar.events.vehicle-status}
      load-events: ${TRUCKCAR_LOAD_EVENTS_TOPIC:truckcar.events.load-allocation}
  outbox:
    publish-interval-ms: ${TRUCKCAR_OUTBOX_PUBLISH_INTERVAL_MS:1000}
    batch-size: ${TRUCKCAR_OUTBOX_BATCH_SIZE:100}
# ── Observabilidad ──────────────────────────────────────────────────────────────────────────────
# /actuator/prometheus solo es accesible dentro de la red interna: el api-gateway no enruta /actuator/**.
# Las trazas se exportan por OTLP al otel-collector cuando se define MANAGEMENT_OTLP_TRACING_ENDPOINT (en Docker,
# http://otel-collector:4318/v1/traces); sin ella no se exporta nada.
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: ${TRUCKCAR_TRACING_SAMPLING_PROBABILITY:1.0}
    baggage:
      # X-Correlation-Id (lo genera el api-gateway) viaja como cabecera propia en HTTP y en Kafka y se copia al MDC.
      remote-fields: X-Correlation-Id
      correlation:
        fields: X-Correlation-Id

logging:
  # [servicio,traceId,spanId] en cada línea de log y, en las peticiones que lo traen, el X-Correlation-Id.
  include-application-name: false
  pattern:
    correlation: "[${spring.application.name:},%X{traceId:-},%X{spanId:-}] [cid=%X{X-Correlation-Id:-}] "
